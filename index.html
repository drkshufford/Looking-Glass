<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Looking Glass</title>
<!--
  ============================================================
  LOOKING GLASS — Student App (first connected version)
  ------------------------------------------------------------
  STEP 1: paste your two Supabase values in the CONFIG block
          below (find them in Supabase under Settings -> API):
            - Project URL  -> SUPABASE_URL
            - anon public  -> SUPABASE_ANON_KEY
          (The anon public key is safe to put in a web app.
           Never paste the service_role key anywhere.)
  STEP 2: save this file, then open it in your browser to test,
          or drag it onto Vercel/Netlify to put it online.
  ============================================================
-->
<script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=DM+Sans:wght@400;500;600;700&display=swap');
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
body{background:#E9E6F2;font-family:'DM Sans',system-ui,sans-serif;color:#211B36}
#root{min-height:100vh}
input,button{font-family:inherit}
.lg-press{transition:transform .12s ease}
.lg-press:active{transform:scale(.97)}
.lg-scroll::-webkit-scrollbar{width:7px;height:7px}.lg-scroll::-webkit-scrollbar-thumb{background:#CFC9E0;border-radius:7px}
.lg-spin{width:30px;height:30px;border:3px solid #D8D3E5;border-top-color:#322A56;border-radius:50%;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.lg-toast{animation:pop .25s ease}
@keyframes pop{from{transform:translate(-50%,12px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes confetti{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(72vh) rotate(420deg);opacity:0}}
.lg-confetti{animation-name:confetti;animation-timing-function:linear;animation-fill-mode:forwards}
@keyframes cele{0%{transform:scale(.7);opacity:0}60%{transform:scale(1.04)}100%{transform:scale(1);opacity:1}}
.lg-cele{animation:cele .35s ease}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo } = React;
const { createClient } = supabase;

/* ============ CONFIG — PASTE YOUR TWO VALUES ============ */
const SUPABASE_URL = "https://pftdeqfzoazzauegvlao.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_yBHE77QR_GHh6yE-CRAxLg_0hYCUJR8";
/* ======================================================= */

const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ---------- tokens ---------- */
const T = { bg:"#F1EFF7", surface:"#FFFFFF", ink:"#211B36", inkSoft:"#6E6884", line:"#E7E3F0",
  anchor:"#322A56", anchorDeep:"#241E45", coral:"#EE6347", coralSoft:"#FBE7E1",
  easy:"#3DA388", medium:"#4C7DF0", hard:"#E2913A", expert:"#DD5470" };
const tierMeta = {
  Easy:{c:T.easy,tint:"#E4F2EE",req:6,pts:3,label:"Warming Up"},
  Medium:{c:T.medium,tint:"#E6EDFD",req:6,pts:4,label:"Stepping Out"},
  Hard:{c:T.hard,tint:"#FAEFDF",req:5,pts:6,label:"Leaning In"},
  Expert:{c:T.expert,tint:"#FBE7EC",req:4,pts:7,label:"Full Reach"},
};
const tiers = ["Easy","Medium","Hard","Expert"];
const relOrder = ["Family","Friend","Stranger/Acquaintance","Workplace","Romantic"];
const relShort = r => r==="Stranger/Acquaintance" ? "Stranger" : r;
const fmtColor = f => !f ? T.inkSoft : f==="In person" ? T.coral : (f.includes("call") && !f.includes("message")) ? T.medium : T.easy;
const shade = (h)=>{const n=parseInt(h.slice(1),16);let r=(n>>16)-22,g=((n>>8)&255)-22,b=(n&255)-22;r=Math.max(0,r);g=Math.max(0,g);b=Math.max(0,b);return "#"+((r<<16)|(g<<8)|b).toString(16).padStart(6,"0");};

/* ---------- tiny inline icons ---------- */
const Svg = (p)=> <svg width={p.s||18} height={p.s||18} viewBox="0 0 24 24" fill="none" stroke={p.c||"currentColor"} strokeWidth={p.w||2} strokeLinecap="round" strokeLinejoin="round" style={p.style}>{p.children}</svg>;
const ILock=(p)=><Svg {...p}><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></Svg>;
const ICheck=(p)=><Svg {...p}><polyline points="20 6 9 17 4 12"/></Svg>;
const IUndo=(p)=><Svg {...p}><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-1"/></Svg>;
const IRepeat=(p)=><Svg {...p}><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></Svg>;
const ITrophy=(p)=><Svg {...p}><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 22V9a8 8 0 0 0 8-8H6a8 8 0 0 0 8 8"/></Svg>;
const IUser=(p)=><Svg {...p}><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></Svg>;
const ICompass=(p)=><Svg {...p}><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></Svg>;
const IBack=(p)=><Svg {...p}><polyline points="15 18 9 12 15 6"/></Svg>;
const IOut=(p)=><Svg {...p}><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></Svg>;
const IBell=(p)=><Svg {...p}><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></Svg>;
const IPlus=(p)=><Svg {...p}><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></Svg>;
const ICopy=(p)=><Svg {...p}><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></Svg>;
const IChevR=(p)=><Svg {...p}><polyline points="9 18 15 12 9 6"/></Svg>;
const IBookmark=({s=18,c="currentColor",fill="none"})=> <svg width={s} height={s} viewBox="0 0 24 24" fill={fill} stroke={c} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>;
const IChat=(p)=><Svg {...p}><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></Svg>;
const IEdit=(p)=><Svg {...p}><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></Svg>;

/* ============ ROOT ============ */
function App(){
  const [session,setSession]=useState(undefined); // undefined=loading, null=logged out
  useEffect(()=>{
    sb.auth.getSession().then(({data})=>setSession(data.session??null));
    const {data:sub}=sb.auth.onAuthStateChange((_e,s)=>setSession(s??null));
    return ()=>sub.subscription.unsubscribe();
  },[]);
  if(!configured()) return <ConfigNotice/>;
  if(session===undefined) return <Splash/>;
  if(!session) return <AuthScreen/>;
  return <SignedIn session={session}/>;
}
function configured(){ return !SUPABASE_URL.includes("YOUR-PROJECT") && !SUPABASE_ANON_KEY.includes("YOUR-ANON"); }

function Splash(){ return <div style={{minHeight:"100vh",display:"grid",placeItems:"center"}}><div className="lg-spin"/></div>; }

function ConfigNotice(){
  return <Center>
    <Card>
      <Lens/>
      <h1 style={{fontFamily:"'Fraunces',serif",fontSize:24,margin:"14px 0 8px"}}>Almost there</h1>
      <p style={{color:T.inkSoft,fontSize:14,lineHeight:1.6}}>Open this file in a text editor and paste your Supabase <b>Project URL</b> and <b>anon public key</b> into the CONFIG block near the top, then reload. You'll find both in Supabase under Settings, then API.</p>
    </Card>
  </Center>;
}

/* ============ AUTH ============ */
function AuthScreen(){
  const [mode,setMode]=useState("login");
  const [name,setName]=useState(""); const [email,setEmail]=useState(""); const [pw,setPw]=useState("");
  const [busy,setBusy]=useState(false); const [err,setErr]=useState(""); const [note,setNote]=useState("");
  const go=async()=>{
    setErr(""); setNote(""); setBusy(true);
    try{
      if(mode==="signup"){
        const {data,error}=await sb.auth.signUp({email,password:pw,options:{data:{name,role:"student"}}});
        if(error) throw error;
        if(!data.session) setNote("Account made. If it doesn't sign you in, email confirmation may be on in Supabase. Turn it off for the pilot, then log in.");
      }else{
        const {error}=await sb.auth.signInWithPassword({email,password:pw});
        if(error) throw error;
      }
    }catch(e){ setErr(e.message||"Something went wrong"); }
    setBusy(false);
  };
  return <Center>
    <Card>
      <Lens/>
      <h1 style={{fontFamily:"'Fraunces',serif",fontSize:26,margin:"14px 0 4px"}}>Looking Glass</h1>
      <p style={{color:T.inkSoft,fontSize:13.5,marginBottom:20}}>The social skills challenge.</p>
      {mode==="signup" && <Field label="Your name" value={name} onChange={setName} placeholder="First and last"/>}
      <Field label="Email" value={email} onChange={setEmail} type="email" placeholder="you@school.edu"/>
      <Field label="Password" value={pw} onChange={setPw} type="password" placeholder="At least 6 characters"/>
      {err && <Msg c={T.coral}>{err}</Msg>}
      {note && <Msg c={T.inkSoft}>{note}</Msg>}
      <button className="lg-press" onClick={go} disabled={busy}
        style={{width:"100%",marginTop:14,padding:"14px",borderRadius:13,border:"none",cursor:"pointer",
          background:`linear-gradient(135deg,${T.coral},${T.expert})`,color:"#fff",fontWeight:700,fontSize:15}}>
        {busy ? "..." : mode==="signup" ? "Create account" : "Log in"}
      </button>
      <button onClick={()=>{setMode(mode==="login"?"signup":"login");setErr("");setNote("");}}
        style={{width:"100%",marginTop:12,background:"none",border:"none",cursor:"pointer",color:T.anchor,fontSize:13.5,fontWeight:600}}>
        {mode==="login" ? "New here? Create an account" : "Already have an account? Log in"}
      </button>
    </Card>
  </Center>;
}

/* ============ SIGNED IN — routes by role ============ */
function SignedIn({session}){
  const uid=session.user.id;
  const [profile,setProfile]=useState(undefined); // undefined=loading
  useEffect(()=>{ sb.from("profiles").select("*").eq("id",uid).maybeSingle().then(({data})=>setProfile(data??null)); },[uid]);
  if(profile===undefined) return <Splash/>;
  if(profile && profile.role==="instructor") return <Instructor session={session} profile={profile}/>;
  return <StudentMembership session={session} profile={profile}/>;
}

function StudentMembership({session,profile}){
  const uid=session.user.id;
  const [enr,setEnr]=useState(undefined); // undefined=loading, null=not enrolled
  const loadMembership=async()=>{
    const {data:e}=await sb.from("enrollments").select("*, sections(*)").eq("person_id",uid).limit(1).maybeSingle();
    setEnr(e??null);
  };
  useEffect(()=>{ loadMembership(); },[uid]);
  if(enr===undefined) return <Splash/>;
  if(!enr) return <JoinScreen onJoined={loadMembership} name={profile?.name}/>;
  return <Student session={session} enrollment={enr} profile={profile}/>;
}

/* ============ JOIN A SECTION ============ */
function JoinScreen({onJoined,name}){
  const [code,setCode]=useState(""); const [busy,setBusy]=useState(false); const [err,setErr]=useState("");
  const join=async()=>{
    setErr(""); setBusy(true);
    const {error}=await sb.rpc("enroll_with_code",{code:code.trim()});
    setBusy(false);
    if(error) setErr(error.message||"That code didn't work"); else onJoined();
  };
  return <Center>
    <Card>
      <Lens/>
      <h1 style={{fontFamily:"'Fraunces',serif",fontSize:23,margin:"14px 0 4px"}}>Welcome{name?`, ${name.split(" ")[0]}`:""}</h1>
      <p style={{color:T.inkSoft,fontSize:13.5,marginBottom:18}}>Enter the join code from your instructor to get into your class. You'll get a random animal nickname that only your instructor can match to you.</p>
      <Field label="Join code" value={code} onChange={v=>setCode(v.toUpperCase())} placeholder="e.g. FOX-4821"/>
      {err && <Msg c={T.coral}>{err}</Msg>}
      <button className="lg-press" onClick={join} disabled={busy||!code}
        style={{width:"100%",marginTop:14,padding:"14px",borderRadius:13,border:"none",cursor:"pointer",
          background:T.anchor,color:"#fff",fontWeight:700,fontSize:15,opacity:code?1:.5}}>
        {busy?"...":"Join class"}
      </button>
      <button onClick={()=>sb.auth.signOut()} style={{width:"100%",marginTop:12,background:"none",border:"none",cursor:"pointer",color:T.inkSoft,fontSize:13}}>Log out</button>
    </Card>
  </Center>;
}

/* ============ STUDENT EXPERIENCE ============ */
function Student({session,enrollment,profile}){
  const enr=enrollment; const section=enr.sections;
  const [tasks,setTasks]=useState([]);
  const [sched,setSched]=useState({});
  const [comps,setComps]=useState([]);     // {id, task_id}
  const [board,setBoard]=useState([]);
  const [notes,setNotes]=useState([]);
  const [savedIds,setSavedIds]=useState(new Set());
  const [optIn,setOptIn]=useState(enr.opted_in);
  const [celebrate,setCelebrate]=useState(null);
  const [ready,setReady]=useState(false);
  const [view,setView]=useState("challenges");
  const [tier,setTier]=useState("Easy");
  const [filter,setFilter]=useState("All");
  const [open,setOpen]=useState(null);
  const [toast,setToast]=useState(null);

  const showToast=m=>{setToast(m);setTimeout(()=>setToast(null),2600);};

  const loadTasks=async()=>{ const {data}=await sb.from("tasks").select("*").eq("is_active",true).order("sort_order"); setTasks(data||[]); };
  const loadSched=async()=>{ const {data}=await sb.from("schedule").select("*").eq("section_id",section.id);
    const m={}; (data||[]).forEach(r=>m[r.tier]=r); setSched(m); };
  const loadComps=async()=>{ const {data}=await sb.from("completions").select("id, task_id").eq("enrollment_id",enr.id); setComps(data||[]); };
  const loadBoard=async()=>{ const {data}=await sb.rpc("section_leaderboard",{sec:section.id}); setBoard(data||[]); };
  const loadNotes=async()=>{ const {data}=await sb.from("notifications").select("*").eq("enrollment_id",enr.id).is("read_at",null).order("created_at",{ascending:false}); setNotes(data||[]); };
  const loadSaved=async()=>{ const {data}=await sb.from("saved_tasks").select("task_id").eq("enrollment_id",enr.id); setSavedIds(new Set((data||[]).map(r=>r.task_id))); };
  const dismissNote=async(id)=>{ setNotes(n=>n.filter(x=>x.id!==id)); await sb.from("notifications").update({read_at:new Date().toISOString()}).eq("id",id); };

  useEffect(()=>{ (async()=>{ await Promise.all([loadTasks(),loadSched(),loadComps(),loadBoard(),loadNotes(),loadSaved()]); setReady(true); })(); },[]);
  useEffect(()=>{
    const iv=setInterval(loadNotes,25000);
    const refetch=()=>{ if(!document.hidden) loadNotes(); };
    window.addEventListener("focus",refetch);
    document.addEventListener("visibilitychange",refetch);
    return ()=>{ clearInterval(iv); window.removeEventListener("focus",refetch); document.removeEventListener("visibilitychange",refetch); };
  },[]);

  const countOf=id=>comps.filter(c=>c.task_id===id).length;
  const tierTasks=t=>tasks.filter(x=>x.tier===t);
  const isLocked=t=>{ const s=sched[t]; return !s || s.is_locked; };
  const uniqueCore=t=>{ const ids=new Set(comps.map(c=>c.task_id)); return tierTasks(t).filter(x=>x.core_or_bonus==="Core" && ids.has(x.id)).length; };
  const projectPoints=useMemo(()=>tiers.reduce((s,t)=>s+Math.min(uniqueCore(t),tierMeta[t].req)*tierMeta[t].pts,0),[comps,tasks]);
  const myBoardPts=useMemo(()=>{ const r=board.find(b=>b.enrollment_id===enr.id); return r?r.points:0; },[board]);

  const complete=async(task,repeat)=>{
    const {error}=await sb.from("completions").insert({enrollment_id:enr.id,task_id:task.id});
    if(error){ showToast("Could not save, try again"); return; }
    await loadComps(); loadBoard();
    setCelebrate({pts:task.points,repeat:!!repeat});
  };
  const undo=async(task)=>{
    const mine=comps.filter(c=>c.task_id===task.id);
    if(!mine.length) return;
    const last=mine[mine.length-1];
    const {error}=await sb.from("completions").delete().eq("id",last.id);
    if(error){ showToast("Could not undo, try again"); return; }
    await loadComps(); loadBoard();
    showToast(mine.length>1?`Removed one. You're back to ${mine.length-1}.`:"Undone. No points for this one.");
  };
  const toggleOptIn=async()=>{
    const nv=!optIn; setOptIn(nv);
    await sb.from("enrollments").update({opted_in:nv}).eq("id",enr.id);
    loadBoard();
  };
  const toggleSaved=async(task)=>{
    const on=savedIds.has(task.id);
    setSavedIds(s=>{ const n=new Set(s); on?n.delete(task.id):n.add(task.id); return n; });
    if(on) await sb.from("saved_tasks").delete().eq("enrollment_id",enr.id).eq("task_id",task.id);
    else await sb.from("saved_tasks").insert({enrollment_id:enr.id,task_id:task.id});
  };

  if(!ready) return <Splash/>;

  return <div style={{maxWidth:440,margin:"0 auto",minHeight:"100vh",background:T.bg,position:"relative",paddingBottom:78}}>
    <Header animal={enr.animal_nickname} points={projectPoints}/>
    {section.archived && <div style={{margin:"12px 14px 0",padding:"11px 13px",background:T.bg,border:`1px solid ${T.line}`,borderRadius:12,fontSize:13,color:T.inkSoft,textAlign:"center",fontWeight:600,lineHeight:1.5}}>This class has ended. Your work is saved and view-only.</div>}
    {notes.length>0 && <div style={{padding:"12px 14px 0"}}>
      {notes.map(n=><div key={n.id} style={{display:"flex",alignItems:"flex-start",gap:11,background:"#fff",border:`1px solid ${T.line}`,borderLeft:`4px solid ${T.coral}`,borderRadius:13,padding:"12px 14px",marginBottom:8,boxShadow:"0 6px 18px -10px rgba(238,99,71,.5)",animation:"fade .25s ease"}}>
        <span style={{flexShrink:0,width:30,height:30,borderRadius:9,background:T.coralSoft,display:"grid",placeItems:"center"}}><IBell s={16} c={T.coral}/></span>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontSize:12,fontWeight:700,color:T.coral,letterSpacing:.3,textTransform:"uppercase",marginBottom:2}}>Message from your instructor</div>
          <div style={{fontSize:13.5,color:T.ink,lineHeight:1.5}}>{n.message||"Checking in on your progress."}</div>
        </div>
        <button onClick={()=>dismissNote(n.id)} style={{background:"none",border:"none",cursor:"pointer",color:T.inkSoft,fontSize:13,fontWeight:600,fontFamily:"inherit",flexShrink:0}}>Dismiss</button>
      </div>)}
    </div>}
    {view==="challenges" && <Challenges {...{tasks,tier,setTier,filter,setFilter,sched,isLocked,tierTasks,countOf,uniqueCore,setOpen,savedIds,toggleSaved}}/>}
    {view==="list" && <MyListView {...{tasks,savedIds,countOf,isLocked,setOpen,toggleSaved}}/>}
    {view==="toolkit" && <Toolkit/>}
    {view==="leaderboard" && <LeaderboardView board={board} optIn={optIn} toggleOptIn={toggleOptIn} myId={enr.id}/>}
    {view==="me" && <MeView {...{projectPoints,myBoardPts,uniqueCore,optIn,name:profile?.name,animal:enr.animal_nickname,section,isLocked,sched}}/>}
    {open && <TaskSheet task={open} count={countOf(open.id)} locked={isLocked(open.tier)} close={()=>setOpen(null)} complete={complete} undo={undo} sched={sched} saved={savedIds.has(open.id)} onToggleSave={toggleSaved} readOnly={!!section.archived}/>}
    <BottomNav view={view} setView={setView}/>
    {celebrate && <Celebration pts={celebrate.pts} onDone={()=>setCelebrate(null)}/>}
    {toast && <div className="lg-toast" style={{position:"fixed",bottom:90,left:"50%",transform:"translateX(-50%)",background:T.anchorDeep,color:"#fff",padding:"11px 17px",borderRadius:12,fontSize:13.5,fontWeight:500,display:"flex",alignItems:"center",gap:8,zIndex:60,maxWidth:380,boxShadow:"0 14px 34px -10px rgba(40,30,80,.6)"}}><ICheck s={15} c="#fff"/> {toast}</div>}
  </div>;
}

function Header({animal,points}){
  return <div style={{background:`linear-gradient(135deg,${T.anchor},${T.anchorDeep})`,padding:"18px 20px 16px",color:"#fff",position:"sticky",top:0,zIndex:20}}>
    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
      <div style={{display:"flex",alignItems:"center",gap:10}}>
        <Lens small/>
        <div>
          <div style={{fontFamily:"'Fraunces',serif",fontSize:17,fontWeight:600}}>Looking Glass</div>
          <div style={{fontSize:11.5,color:"#B7AEDC"}}>You're {animal}</div>
        </div>
      </div>
      <div style={{textAlign:"right"}}>
        <div style={{fontSize:20,fontWeight:800,fontVariantNumeric:"tabular-nums"}}>{points}<span style={{fontSize:12,color:"#B7AEDC"}}>/100</span></div>
        <div style={{fontSize:10,color:"#B7AEDC",letterSpacing:.4,textTransform:"uppercase"}}>Project points</div>
      </div>
    </div>
  </div>;
}

function Challenges({tasks,tier,setTier,filter,setFilter,sched,isLocked,tierTasks,countOf,uniqueCore,setOpen,savedIds,toggleSaved}){
  const m=tierMeta[tier]; const locked=isLocked(tier);
  const list=tierTasks(tier).filter(t=>filter==="All"||t.relationship_type===filter);
  const rels=["All",...relOrder.filter(r=>tierTasks(tier).some(t=>t.relationship_type===r))];
  const done=Math.min(uniqueCore(tier),m.req);
  const unlockText=t=>{ const s=sched[t]; if(s&&s.unlock_date) return "Unlocks "+new Date(s.unlock_date+"T00:00").toLocaleDateString(undefined,{month:"short",day:"numeric"}); return "Locked"; };
  return <div style={{padding:"16px 16px 8px"}}>
    <div className="lg-scroll" style={{display:"flex",gap:8,overflowX:"auto",paddingBottom:6}}>
      {tiers.map(t=>{ const tm=tierMeta[t]; const lk=isLocked(t); const a=t===tier;
        return <button key={t} className="lg-press" onClick={()=>setTier(t)} style={{flexShrink:0,display:"flex",alignItems:"center",gap:6,padding:"9px 15px",borderRadius:12,border:"none",cursor:"pointer",fontWeight:a?700:600,fontSize:14,fontFamily:"inherit",background:a?tm.c:tm.tint,color:a?"#fff":tm.c}}>
          {lk && <ILock s={13} c={a?"#fff":tm.c}/>} {t}
        </button>; })}
    </div>

    {locked ? (
      <div style={{marginTop:18,background:T.surface,borderRadius:16,padding:"28px 20px",textAlign:"center",border:`1px solid ${T.line}`}}>
        <ILock s={26} c={m.c}/>
        <div style={{fontFamily:"'Fraunces',serif",fontSize:19,margin:"10px 0 4px"}}>{tier} is locked</div>
        <div style={{color:T.inkSoft,fontSize:13.5}}>{unlockText(tier)}. You can peek at the tasks below.</div>
      </div>
    ) : (
      <div style={{marginTop:16,display:"flex",alignItems:"center",justifyContent:"space-between"}}>
        <div>
          <div style={{fontSize:12,fontWeight:700,color:m.c,letterSpacing:.5,textTransform:"uppercase"}}>{tier} · {m.label}</div>
          <div style={{fontFamily:"'Fraunces',serif",fontSize:22,marginTop:2}}>{done} of {m.req} tasks done</div>
        </div>
        <Ring value={done} max={m.req} color={m.c}/>
      </div>
    )}

    <div className="lg-scroll" style={{display:"flex",gap:8,overflowX:"auto",margin:"14px 0 6px",paddingBottom:4}}>
      {rels.map(r=><button key={r} onClick={()=>setFilter(r)} className="lg-press" style={{flexShrink:0,padding:"8px 14px",borderRadius:20,border:`1px solid ${filter===r?T.anchor:T.line}`,cursor:"pointer",background:filter===r?T.anchor:"#fff",color:filter===r?"#fff":T.inkSoft,fontSize:13,fontWeight:600,fontFamily:"inherit"}}>{relShort(r)}</button>)}
    </div>

    <div style={{display:"flex",flexDirection:"column",gap:10,marginTop:6}}>
      {list.map(t=><TaskCard key={t.id} task={t} count={countOf(t.id)} locked={locked} onClick={()=>setOpen(t)} saved={savedIds.has(t.id)} onToggleSave={toggleSaved}/>)}
    </div>
  </div>;
}

function TaskCard({task,count,locked,onClick,saved,onToggleSave}){
  const done=count>0; const m=tierMeta[task.tier];
  return <div onClick={onClick} className="lg-press" role="button" style={{textAlign:"left",background:task.core_or_bonus==="Bonus"?"#FAF2D8":T.surface,border:`1px solid ${done?m.c:(task.core_or_bonus==="Bonus"?"#E8D9A8":T.line)}`,borderRadius:15,padding:"14px 15px",cursor:"pointer",display:"flex",gap:12,alignItems:"center",fontFamily:"inherit",opacity:locked?.65:1}}>
    <div style={{flexShrink:0,width:42,height:42,borderRadius:11,background:done?m.c:m.tint,display:"grid",placeItems:"center",color:done?"#fff":m.c,fontWeight:800,fontSize:done?16:14}}>
      {done?<ICheck s={20} c="#fff"/>:`+${task.points}`}
    </div>
    <div style={{flex:1,minWidth:0}}>
      <div style={{fontSize:15,fontWeight:600,lineHeight:1.25}}>{task.title}</div>
      <div style={{display:"flex",alignItems:"center",gap:7,marginTop:5,flexWrap:"wrap"}}>
        <span style={{fontSize:11,fontWeight:600,color:T.anchor,background:"#EFEDF7",padding:"2px 8px",borderRadius:6}}>{relShort(task.relationship_type)}</span>
        <span style={{fontSize:11,color:fmtColor(task.format),fontWeight:600}}>· {task.format}</span>
        {count>1 && <span style={{fontSize:11,color:T.inkSoft,display:"flex",alignItems:"center",gap:3}}><IRepeat s={12}/>{count}×</span>}
      </div>
    </div>
    {onToggleSave && <button onClick={e=>{e.stopPropagation();onToggleSave(task);}} aria-label={saved?"Remove from My List":"Save to My List"} className="lg-press" style={{flexShrink:0,alignSelf:"flex-start",background:"none",border:"none",cursor:"pointer",padding:4,margin:"-2px -4px 0 0"}}><IBookmark s={19} c={saved?T.coral:T.inkSoft} fill={saved?T.coral:"none"}/></button>}
  </div>;
}

const Tag=({children,c=T.anchor,bg="#EFEDF7"})=> <span style={{fontSize:11.5,fontWeight:700,color:c,background:bg,padding:"3px 9px",borderRadius:7}}>{children}</span>;

function TaskSheet({task,count,locked,close,complete,undo,sched,saved,onToggleSave,readOnly}){
  const m=tierMeta[task.tier];
  const Row=({label,children})=> children ? <div style={{marginTop:16}}>
    <div style={{fontSize:11,fontWeight:700,color:m.c,letterSpacing:.5,textTransform:"uppercase",marginBottom:4}}>{label}</div>
    <div style={{fontSize:13.5,color:T.ink,lineHeight:1.55}}>{children}</div></div> : null;
  return <div onClick={close} style={{position:"fixed",inset:0,background:"rgba(30,22,52,.45)",zIndex:50,display:"flex",alignItems:"flex-end",justifyContent:"center",animation:"fade .2s ease"}}>
    <div onClick={e=>e.stopPropagation()} className="lg-scroll" style={{background:"#fff",width:"100%",maxWidth:440,maxHeight:"92vh",overflowY:"auto",borderRadius:"22px 22px 0 0",padding:"8px 0 24px"}}>
      <div style={{display:"flex",justifyContent:"center",padding:"6px 0"}}><div style={{width:40,height:5,borderRadius:5,background:T.line}}/></div>
      <div style={{padding:"6px 20px 0"}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
          <button onClick={close} style={{display:"flex",alignItems:"center",gap:4,background:"none",border:"none",cursor:"pointer",color:T.inkSoft,fontSize:13.5,fontFamily:"inherit",padding:"4px 0"}}><IBack s={16}/> Back</button>
          {onToggleSave && <button onClick={()=>onToggleSave(task)} className="lg-press" style={{display:"flex",alignItems:"center",gap:6,background:saved?T.coralSoft:"#fff",border:`1px solid ${saved?T.coral:T.line}`,borderRadius:10,padding:"7px 12px",cursor:"pointer",color:saved?T.coral:T.inkSoft,fontSize:12.5,fontWeight:600,fontFamily:"inherit"}}><IBookmark s={15} c={saved?T.coral:T.inkSoft} fill={saved?T.coral:"none"}/>{saved?"Saved":"Save to My List"}</button>}
        </div>
        <div style={{display:"flex",gap:8,flexWrap:"wrap",margin:"10px 0 6px"}}>
          <Tag c="#fff" bg={m.c}>{task.tier} · +{task.points}</Tag>
          <Tag>{relShort(task.relationship_type)}</Tag>
          <Tag c={task.core_or_bonus==="Bonus"?"#9A7B1E":T.anchor} bg={task.core_or_bonus==="Bonus"?"#F6EFD9":"#EFEDF7"}>{task.core_or_bonus}</Tag>
          <Tag c={fmtColor(task.format)} bg={T.bg}>{task.format}</Tag>
        </div>
        <h2 style={{fontFamily:"'Fraunces',serif",fontSize:23,lineHeight:1.2,margin:"6px 0"}}>{task.title}</h2>
        <div style={{fontSize:15,color:T.ink,lineHeight:1.55,marginTop:6}}>{task.task_text}</div>
        <Row label="Concept">{task.concept ? <span><b>{task.concept}.</b> {task.concept_explanation}</span> : null}</Row>
        <Row label="Hints">{task.hints}</Row>
        <Row label="Safety">{task.safety}</Row>
        <Row label="A graceful exit">{task.exit}</Row>
        <Row label="The goal, and what to expect">{task.goal}</Row>
        <Row label="For your logbook">{task.logbook_addon}</Row>

        <div style={{marginTop:24}}>
          {locked ? (
            <div style={{textAlign:"center",padding:14,background:m.tint,borderRadius:14,color:T.ink,fontSize:13.5,fontWeight:600}}><ILock s={16} c={m.c} style={{verticalAlign:"-3px",marginRight:6}}/>This tier isn't open yet</div>
          ) : readOnly ? (
            <div style={{textAlign:"center",padding:14,background:T.bg,border:`1px solid ${T.line}`,borderRadius:14,color:T.inkSoft,fontSize:13.5,fontWeight:600}}>{count>0 ? `Completed${count>1?` · ${count} times`:""}. This class has ended, so it's view-only now.` : "This class has ended, so it's view-only now."}</div>
          ) : count===0 ? (
            <button className="lg-press" onClick={()=>{complete(task,false);close();}} style={{width:"100%",padding:15,borderRadius:14,border:"none",cursor:"pointer",color:"#fff",background:`linear-gradient(135deg,${m.c},${shade(m.c)})`,fontSize:15,fontWeight:700,fontFamily:"inherit"}}>I've completed this task and its logbook entry</button>
          ) : (
            <div>
              <div style={{display:"flex",alignItems:"center",gap:8,justifyContent:"center",color:m.c,fontWeight:700,fontSize:14.5,marginBottom:12}}><ICheck s={18} c={m.c}/> Completed{count>1?` · ${count} times`:""}</div>
              <button className="lg-press" onClick={()=>complete(task,true)} style={{width:"100%",padding:13,borderRadius:14,border:`1.5px solid ${m.c}`,cursor:"pointer",color:m.c,background:"#fff",fontSize:14,fontWeight:600,fontFamily:"inherit",display:"flex",alignItems:"center",justifyContent:"center",gap:7}}><IRepeat s={16} c={m.c}/> Do it again for leaderboard points</button>
              <div style={{fontSize:11.5,color:T.inkSoft,textAlign:"center",marginTop:8,lineHeight:1.5}}>Repeats add to the leaderboard only, with a new person each time.</div>

            </div>
          )}
        </div>
      </div>
    </div>
  </div>;

function LeaderboardView({board,optIn,toggleOptIn,myId}){
  const ranked=board.filter(b=>b.opted_in).sort((a,b)=>b.points-a.points);
  const medal=["#E8B43C","#B9BCC8","#CD8B57"];
  return <div style={{padding:"18px 16px"}}>
    <h2 style={{fontFamily:"'Fraunces',serif",fontSize:22,marginBottom:4}}>Leaderboard</h2>
    <p style={{color:T.inkSoft,fontSize:13,marginBottom:14}}>Everyone shows up as their animal. Top three earn extra credit.</p>
    <div style={{background:T.surface,border:`1px solid ${T.line}`,borderRadius:14,padding:"12px 14px",marginBottom:14,display:"flex",alignItems:"center",justifyContent:"space-between"}}>
      <div><div style={{fontSize:14,fontWeight:600}}>{optIn?"You're on the board":"You're sitting it out"}</div><div style={{fontSize:12,color:T.inkSoft}}>Your points count either way.</div></div>
      <button className="lg-press" onClick={toggleOptIn} style={{padding:"8px 14px",borderRadius:10,border:"none",cursor:"pointer",fontWeight:600,fontSize:13,fontFamily:"inherit",background:optIn?"#F0EEF6":T.anchor,color:optIn?T.inkSoft:"#fff"}}>{optIn?"Leave":"Join"}</button>
    </div>
    {ranked.length===0 ? <Empty>No one's on the board yet.</Empty> : <div style={{display:"flex",flexDirection:"column",gap:7}}>
      {ranked.map((b,i)=><div key={b.enrollment_id} style={{display:"flex",alignItems:"center",gap:12,padding:"12px 14px",borderRadius:12,background:b.enrollment_id===myId?T.coralSoft:T.surface,border:`1px solid ${b.enrollment_id===myId?T.coral:T.line}`}}>
        <span style={{width:22,textAlign:"center",fontWeight:800,color:i<3?medal[i]:T.inkSoft}}>{i+1}</span>
        <div style={{flex:1,fontSize:14.5,fontWeight:600}}>{b.animal_nickname}{b.enrollment_id===myId?" (you)":""}{i<3?<span style={{fontSize:11,color:T.inkSoft,fontWeight:500}}> · +{[10,5,3][i]} extra credit</span>:null}</div>
        <span style={{fontWeight:800,fontVariantNumeric:"tabular-nums"}}>{b.points}</span>
      </div>)}
    </div>}
  </div>;
}

function MeView({projectPoints,myBoardPts,uniqueCore,optIn,name,animal,section,isLocked,sched}){
  const done=t=>Math.min(uniqueCore(t),tierMeta[t].req);
  const allDone=tiers.every(t=>done(t)>=tierMeta[t].req);
  const current=tiers.find(t=>!isLocked(t) && done(t)<tierMeta[t].req);
  return <div style={{padding:"18px 16px"}}>
    <div style={{display:"flex",alignItems:"center",gap:14,marginBottom:18}}>
      <div style={{width:56,height:56,borderRadius:"50%",background:`linear-gradient(135deg,${T.coralSoft},#EDE8FA)`,display:"grid",placeItems:"center"}}><IUser s={26} c={T.anchor}/></div>
      <div>
        <div style={{fontFamily:"'Fraunces',serif",fontSize:21}}>{name||"You"}</div>
        <div style={{fontSize:13,color:T.inkSoft}}>{animal} · {section?.course_code} Sec {section?.section_number}</div>
      </div>
    </div>
    <div style={{display:"flex",gap:10,marginBottom:8}}>
      <Stat label="Project points" value={`${projectPoints}/100`} c={T.coral}/>
      <Stat label="Leaderboard points" value={myBoardPts} c={T.medium}/>
    </div>
    <div style={{fontSize:12.5,color:T.inkSoft,lineHeight:1.5,margin:"4px 2px 16px"}}>Project points come only from required tasks and decide your grade. Leaderboard points also include repeats and bonus tasks.</div>
    <div style={{fontSize:13.5,fontWeight:600,margin:"0 2px 12px",color:T.ink}}>
      {allDone ? "You've reached Full Reach. Every tier complete."
        : current ? <>You're working through <span style={{color:tierMeta[current].c}}>{current}</span>, {tierMeta[current].label}.</>
        : "Your next tier unlocks soon."}
    </div>
    <Journey uniqueCore={uniqueCore} isLocked={isLocked} sched={sched}/>
    <button className="lg-press" onClick={()=>sb.auth.signOut()} style={{width:"100%",marginTop:16,padding:12,borderRadius:12,border:`1px solid ${T.line}`,background:"#fff",cursor:"pointer",color:T.inkSoft,fontSize:13.5,fontWeight:600,fontFamily:"inherit",display:"flex",alignItems:"center",justifyContent:"center",gap:7}}><IOut s={16}/> Log out</button>
  </div>;
}

function Journey({uniqueCore,isLocked,sched}){
  const done=t=>Math.min(uniqueCore(t),tierMeta[t].req);
  return <div style={{background:T.surface,border:`1px solid ${T.line}`,borderRadius:16,padding:"18px 16px 8px"}}>
    <div style={{fontSize:12,fontWeight:700,letterSpacing:.4,textTransform:"uppercase",color:T.ink,marginBottom:16}}>Your journey</div>
    {tiers.map((t,i)=>{
      const m=tierMeta[t]; const n=done(t); const isDone=n>=m.req; const locked=isLocked(t); const last=i===tiers.length-1;
      return <div key={t} style={{display:"flex",gap:14}}>
        <div style={{display:"flex",flexDirection:"column",alignItems:"center",width:58}}>
          {locked
            ? <div style={{width:58,height:58,borderRadius:"50%",border:`3px solid ${T.line}`,display:"grid",placeItems:"center",flexShrink:0}}><ILock s={20} c={T.inkSoft}/></div>
            : <div style={{position:"relative",flexShrink:0}}><Ring value={n} max={m.req} color={m.c}/>{isDone && <div style={{position:"absolute",right:-1,bottom:-1,width:22,height:22,borderRadius:"50%",background:m.c,display:"grid",placeItems:"center",border:"2px solid #fff"}}><ICheck s={12} c="#fff"/></div>}</div>}
          {!last && <div style={{flex:1,width:3,minHeight:22,background:isDone?m.c:T.line,borderRadius:2,margin:"3px 0"}}/>}
        </div>
        <div style={{flex:1,paddingTop:8,paddingBottom:last?8:16}}>
          <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
            <span style={{fontSize:15,fontWeight:700,color:locked?T.inkSoft:T.ink}}>{t}</span>
            <span style={{fontSize:11,fontWeight:600,color:locked?T.inkSoft:m.c,background:locked?T.bg:m.tint,padding:"2px 8px",borderRadius:6}}>{m.label}</span>
          </div>
          <div style={{fontSize:12.5,color:T.inkSoft,marginTop:4}}>
            {locked ? (sched&&sched[t]&&sched[t].unlock_date ? `Unlocks ${sched[t].unlock_date}` : "Locked for now")
                    : isDone ? "Complete. Nice work." : `${n} of ${m.req} core tasks done`}
          </div>
        </div>
      </div>;
    })}
  </div>;
}

function Celebration({pts,onDone}){
  useEffect(()=>{ const t=setTimeout(onDone,2600); return ()=>clearTimeout(t); },[]);
  const colors=[T.coral,T.easy,T.medium,T.hard,T.expert];
  const bits=useMemo(()=>Array.from({length:18},(_,i)=>({left:8+Math.random()*84,delay:Math.random()*0.25,color:colors[i%colors.length],dur:0.9+Math.random()*0.7})),[]);
  return <div style={{position:"fixed",inset:0,zIndex:80,display:"grid",placeItems:"center",pointerEvents:"none"}}>
    <div style={{position:"absolute",inset:0,overflow:"hidden"}}>
      {bits.map((b,i)=><div key={i} className="lg-confetti" style={{position:"absolute",top:"36%",left:`${b.left}%`,width:9,height:14,background:b.color,borderRadius:2,animationDelay:`${b.delay}s`,animationDuration:`${b.dur}s`}}/>)}
    </div>
    <div className="lg-cele" style={{background:"#fff",borderRadius:20,padding:"22px 26px",textAlign:"center",boxShadow:"0 24px 60px -24px rgba(40,30,80,.45)",maxWidth:240}}>
      <div style={{width:58,height:58,borderRadius:"50%",background:`linear-gradient(135deg,${T.coral},${T.expert})`,display:"grid",placeItems:"center",margin:"0 auto 10px"}}><ICheck s={28} c="#fff"/></div>
      <div style={{fontFamily:"'Fraunces',serif",fontSize:22}}>Logged!</div>
      <div style={{fontSize:14,color:T.coral,fontWeight:700,marginTop:2}}>+{pts} points</div>
      <div style={{fontSize:12.5,color:T.inkSoft,marginTop:6,lineHeight:1.45}}>That's a real rep. Add the details to your Canvas logbook.</div>
    </div>
  </div>;
}

function MyListView({tasks,savedIds,countOf,isLocked,setOpen,toggleSaved}){
  const saved=tasks.filter(t=>savedIds.has(t.id));
  return <div style={{padding:"18px 16px"}}>
    <h2 style={{fontFamily:"'Fraunces',serif",fontSize:22,marginBottom:4}}>My List</h2>
    <p style={{color:T.inkSoft,fontSize:13,marginBottom:16,lineHeight:1.5}}>The tasks you bookmarked, so you can jump straight to the ones you want. Tap the bookmark on any task to add or remove it.</p>
    {saved.length===0 ? <Empty>Nothing saved yet. Browse Challenges and tap the bookmark on any task you want to try.</Empty> :
      tiers.map(tier=>{
        const items=saved.filter(t=>t.tier===tier);
        if(items.length===0) return null;
        const m=tierMeta[tier];
        return <div key={tier} style={{marginBottom:16}}>
          <div style={{fontSize:12,fontWeight:700,color:m.c,letterSpacing:.4,textTransform:"uppercase",marginBottom:8}}>{tier}</div>
          <div style={{display:"flex",flexDirection:"column",gap:10}}>
            {items.map(t=><TaskCard key={t.id} task={t} count={countOf(t.id)} locked={isLocked(t.tier)} onClick={()=>setOpen(t)} saved={true} onToggleSave={toggleSaved}/>)}
          </div>
        </div>;
      })}
  </div>;
}

      "This line is moving slower than I expected. Have you been here before?",

    {label:"Getting to know someone", lines:[

function Toolkit(){
  const [open,setOpen]=useState("Openers");
  return <div style={{padding:"18px 16px"}}>
    <h2 style={{fontFamily:"'Fraunces',serif",fontSize:22,marginBottom:4}}>Toolkit</h2>
    <p style={{color:T.inkSoft,fontSize:13,marginBottom:16,lineHeight:1.5}}>Words for the moment. Tap a category for openers, questions, compliments, and graceful exits you can borrow when you're not sure what to say.</p>
    <div style={{display:"flex",flexDirection:"column",gap:10}}>

function Instructor({session,profile}){
  const uid=session.user.id;
  const [sections,setSections]=useState(undefined);
  const [counts,setCounts]=useState({});
  const [openSec,setOpenSec]=useState(null);
  const [creating,setCreating]=useState(false);
  const [showArchived,setShowArchived]=useState(false);
  const [toast,setToast]=useState(null);
  const showToast=m=>{setToast(m);setTimeout(()=>setToast(null),2800);};

  const load=async()=>{
    const {data:secs}=await sb.from("sections").select("*").eq("instructor_id",uid).order("created_at");
    const list=secs||[];
    const ids=new Set(list.map(s=>s.id));
    const {data:enrs}=await sb.from("enrollments").select("id, section_id");
    const c={}; (enrs||[]).forEach(e=>{ if(ids.has(e.section_id)) c[e.section_id]=(c[e.section_id]||0)+1; });
    setCounts(c); setSections(list);
  };
  useEffect(()=>{ load(); },[uid]);

  if(sections===undefined) return <InstructorShell profile={profile}><Splash/></InstructorShell>;

  const active=sections.filter(s=>!s.archived);
  const archived=sections.filter(s=>s.archived);
  const shown=showArchived?archived:active;

  return <InstructorShell profile={profile} toast={toast}>
    {openSec
      ? <SectionDetail section={openSec} count={counts[openSec.id]||0}
          onBack={()=>{ setOpenSec(null); load(); }} showToast={showToast}/>
      : <div>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16,gap:12,flexWrap:"wrap"}}>
            <div>
              <div style={{fontSize:12,fontWeight:700,color:T.coral,letterSpacing:.5,textTransform:"uppercase"}}>Instructor</div>
              <h1 style={{fontFamily:"'Fraunces',serif",fontSize:26}}>Your sections</h1>
            </div>
            {!showArchived && <button className="lg-press" onClick={()=>setCreating(true)} style={btnPrimary}><IPlus s={16} c="#fff"/> New section</button>}
          </div>
          {archived.length>0 && <div style={{display:"flex",gap:8,marginBottom:16}}>
            <button className="lg-press" onClick={()=>setShowArchived(false)} style={tabBtn(!showArchived)}>Active ({active.length})</button>
            <button className="lg-press" onClick={()=>setShowArchived(true)} style={tabBtn(showArchived)}>Archived ({archived.length})</button>
          </div>}
          {shown.length===0 ? <Empty>{showArchived?"No archived sections.":"No sections yet. Create your first one to get a join code for your students."}</Empty> :
            <div style={{display:"flex",flexDirection:"column",gap:10}}>
              {shown.map(s=><button key={s.id} className="lg-press" onClick={()=>setOpenSec(s)} style={secCardStyle}>
                <div style={{flex:1,minWidth:0,textAlign:"left"}}>
                  <div style={{fontSize:16,fontWeight:700,display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>{s.course_code} · Sec {s.section_number}{s.archived && <span style={{fontSize:10.5,fontWeight:700,color:T.inkSoft,background:T.bg,border:`1px solid ${T.line}`,padding:"2px 7px",borderRadius:6,letterSpacing:.3,textTransform:"uppercase"}}>Archived</span>}</div>
                  <div style={{fontSize:13,color:T.inkSoft,marginTop:2}}>{s.meeting||"No meeting time set"}</div>
                </div>
                <div style={{textAlign:"right"}}>
                  <div style={{fontSize:15,fontWeight:800}}>{counts[s.id]||0}</div>
                  <div style={{fontSize:11,color:T.inkSoft}}>students</div>
                </div>
                <Tag c={T.anchor} bg="#EFEDF7">{s.join_code}</Tag>
                <IChevR s={18} c={T.inkSoft}/>
              </button>)}
            </div>}
        </div>}
    {creating && <CreateSection onClose={()=>setCreating(false)} onCreated={(code)=>{ setCreating(false); load(); showToast("Section created. Join code: "+code); }}/>}
  </InstructorShell>;
}

function CreateSection({onClose,onCreated}){
  const [course,setCourse]=useState("COM 100");
  const [secNum,setSecNum]=useState("");
  const [meeting,setMeeting]=useState("");
  const [code,setCode]=useState("");
  const [busy,setBusy]=useState(false); const [err,setErr]=useState("");
  const go=async()=>{
    setErr(""); setBusy(true);
    const {data,error}=await sb.rpc("create_section",{p_course:course.trim(),p_section:secNum.trim(),p_meeting:meeting.trim(),p_code:code.trim()||null});
    setBusy(false);
    if(error){ setErr(error.message); return; }
    const row=Array.isArray(data)?data[0]:data;
    onCreated(row?.join_code||"");
  };
  return <Modal onClose={onClose} title="Create a section">
    <Field label="Course code" value={course} onChange={setCourse} placeholder="COM 100"/>
    <Field label="Section number" value={secNum} onChange={setSecNum} placeholder="1001"/>
    <Field label="Meeting time (optional)" value={meeting} onChange={setMeeting} placeholder="MW 9:00 AM"/>
    <Field label="Join code (optional)" value={code} onChange={setCode} placeholder="Blank for a random code"/>
    {err && <Msg c={T.coral}>{err}</Msg>}
    <button className="lg-press" onClick={go} disabled={busy||!secNum} style={{...btnPrimary,width:"100%",marginTop:14,justifyContent:"center",opacity:secNum?1:.5}}>{busy?"...":"Create section"}</button>
  </Modal>;
}

function EditSection({sec,onClose,onSaved}){
  const [course,setCourse]=useState(sec.course_code||"");
  const [secNum,setSecNum]=useState(sec.section_number||"");
  const [meeting,setMeeting]=useState(sec.meeting||"");
  const [busy,setBusy]=useState(false); const [err,setErr]=useState("");
  const save=async()=>{
    setErr(""); setBusy(true);
    const patch={course_code:course.trim(),section_number:secNum.trim(),meeting:meeting.trim()||null};
    const {error}=await sb.from("sections").update(patch).eq("id",sec.id);
    setBusy(false);
    if(error){ setErr(error.message); return; }
    onSaved(patch);
  };
  return <Modal onClose={onClose} title="Edit section details">
    <Field label="Course code" value={course} onChange={setCourse} placeholder="COM 100"/>
    <Field label="Section number" value={secNum} onChange={setSecNum} placeholder="1001"/>
    <Field label="Meeting time (optional)" value={meeting} onChange={setMeeting} placeholder="MW 9:00 AM"/>
    {err && <Msg c={T.coral}>{err}</Msg>}
    <button className="lg-press" onClick={save} disabled={busy||!secNum} style={{...btnPrimary,width:"100%",marginTop:14,justifyContent:"center",opacity:secNum?1:.5}}>{busy?"...":"Save changes"}</button>
  </Modal>;
}

function SectionDetail({section,count,onBack,showToast}){
  const [tab,setTab]=useState("roster");
  const [roster,setRoster]=useState([]);
  const [sched,setSched]=useState([]);
  const [tasks,setTasks]=useState([]);
  const [sec,setSec]=useState(section);
  const [busy,setBusy]=useState(true);
  const [changing,setChanging]=useState(false);
  const [editing,setEditing]=useState(false);
  const load=async()=>{
    const order={Easy:0,Medium:1,Hard:2,Expert:3};
    const [{data:r},{data:s},{data:sc},{data:tk}]=await Promise.all([
      sb.rpc("section_roster",{sec:section.id}),
      sb.from("schedule").select("*").eq("section_id",section.id),
      sb.from("sections").select("*").eq("id",section.id).maybeSingle(),
      sb.from("tasks").select("id, code, title, tier, core_or_bonus, points, sort_order").eq("is_active",true).order("sort_order")
    ]);
    setRoster(r||[]);
    setSched((s||[]).sort((a,b)=>order[a.tier]-order[b.tier]));
    setTasks(tk||[]);
    if(sc) setSec(sc);
    setBusy(false);
  };
  useEffect(()=>{ load(); },[section.id]);
  const archiveSection=async(val)=>{
    const {error}=await sb.from("sections").update({archived:val}).eq("id",section.id);
    if(error){ showToast("Could not "+(val?"archive":"unarchive")+": "+error.message); return; }
    showToast(val?"Section archived":"Section unarchived"); onBack();
  };
  const deleteSection=async()=>{
    const warn = count>0
      ? `Delete "${sec.course_code} Sec ${sec.section_number}"? This section has ${count} student${count===1?"":"s"}, and deleting it permanently erases their enrollment and progress. This cannot be undone.`
      : `Delete "${sec.course_code} Sec ${sec.section_number}"? This cannot be undone.`;
    if(!window.confirm(warn)) return;
    const {error}=await sb.from("sections").delete().eq("id",section.id);
    if(error){ showToast("Could not delete: "+error.message); return; }
    showToast("Section deleted"); onBack();
  };

  return <div>
    <button onClick={onBack} style={backBtn}><IBack s={16}/> All sections</button>
    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",margin:"6px 0 16px",flexWrap:"wrap",gap:12}}>
      <div>
        <h1 style={{fontFamily:"'Fraunces',serif",fontSize:24,display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>{sec.course_code} · Sec {sec.section_number}{sec.archived && <span style={{fontSize:11,fontWeight:700,color:T.inkSoft,background:T.bg,border:`1px solid ${T.line}`,padding:"3px 9px",borderRadius:7,letterSpacing:.3,textTransform:"uppercase"}}>Archived</span>}</h1>
        <div style={{fontSize:13,color:T.inkSoft,marginTop:3,display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}><span>{sec.meeting||"No meeting time"} · {count} students</span><button className="lg-press" onClick={()=>setEditing(true)} style={{background:"none",border:"none",cursor:"pointer",color:T.anchor,fontSize:12.5,fontWeight:700,fontFamily:"inherit",padding:0,display:"inline-flex",alignItems:"center",gap:4}}><IEdit s={13} c={T.anchor}/> Edit details</button></div>
      </div>
      <div style={{display:"flex",alignItems:"center",gap:8}}>
        <JoinCodeChip code={sec.join_code} onCopied={()=>showToast("Join code copied")}/>
        <button className="lg-press" onClick={()=>setChanging(true)} style={miniBtn}>Change</button>
      </div>
    </div>
    <div style={{display:"flex",gap:8,marginBottom:18,flexWrap:"wrap"}}>
      {[["roster","Roster"],["schedule","Schedule"],["settings","Settings"]].map(([k,l])=>
        <button key={k} className="lg-press" onClick={()=>setTab(k)} style={tabBtn(tab===k)}>{l}</button>)}
    </div>
    {busy ? <Splash/>
      : tab==="roster"   ? <Roster roster={roster} tasks={tasks} reload={load} showToast={showToast}/>
      : tab==="schedule" ? <Schedule sched={sched} reload={load} showToast={showToast}/>
      :                    <Settings sec={sec} reload={load} showToast={showToast} onDelete={deleteSection} onArchive={archiveSection} archived={sec.archived}/>}
    {changing && <ChangeCodeModal sec={sec} onClose={()=>setChanging(false)} onChanged={(c)=>{ setSec(s=>({...s,join_code:c})); setChanging(false); showToast("New join code: "+c); }}/>}
    {editing && <EditSection sec={sec} onClose={()=>setEditing(false)} onSaved={(patch)=>{ setSec(s=>({...s,...patch})); setEditing(false); showToast("Details updated"); }}/>}
  </div>;
}

function ChangeCodeModal({sec,onClose,onChanged}){
  const [code,setCode]=useState("");
  const [busy,setBusy]=useState(false); const [err,setErr]=useState("");
  const apply=async(useCustom)=>{
    setErr(""); setBusy(true);
    const {data,error}=await sb.rpc("regenerate_join_code",{sec:sec.id,p_code:useCustom?(code.trim()||null):null});
    setBusy(false);
    if(error){ setErr(error.message); return; }
    onChanged(data);

  return <Modal onClose={onClose} title="Change join code">
    <p style={{fontSize:12.5,color:T.inkSoft,lineHeight:1.5,marginBottom:12}}>Type your own code or generate a random one. The current code stops working right away, so anyone you still want in will need the new one.</p>
    <Field label="New code" value={code} onChange={setCode} placeholder="e.g. COM100-SPRING"/>
    {err && <Msg c={T.coral}>{err}</Msg>}
    <div style={{display:"flex",gap:8,marginTop:12}}>
      <button className="lg-press" onClick={()=>apply(true)} disabled={busy||!code.trim()} style={{...btnPrimary,flex:1,justifyContent:"center",opacity:code.trim()?1:.5}}>Use this code</button>
      <button className="lg-press" onClick={()=>apply(false)} disabled={busy} style={{...miniBtn,justifyContent:"center",padding:"10px 14px"}}>Random</button>
    </div>
  </Modal>;
}

function Roster({roster,tasks,reload,showToast}){
  const [sortKey,setSortKey]=useState("project_points");
  const [adjFor,setAdjFor]=useState(null);
  const [detailFor,setDetailFor]=useState(null);
  const sorted=[...roster].sort((a,b)=>{
    if(sortKey==="name") return (a.name||"").localeCompare(b.name||"");
    return ((b[sortKey]||0)-(a[sortKey]||0)) || (a.name||"").localeCompare(b.name||"");
  });
  const nudge=async(r)=>{
    const {error}=await sb.from("notifications").insert({enrollment_id:r.enrollment_id,type:"nudge",message:"Checking in. New challenges are open. Jump back in when you can."});
    showToast(error?("Could not send: "+error.message):("Nudge sent to "+r.animal_nickname));
  };
  if(roster.length===0) return <Empty>No students have joined yet. Share the join code above to get them in.</Empty>;
  return <div>
    <div style={{display:"flex",gap:8,marginBottom:14,flexWrap:"wrap",alignItems:"center"}}>
      <span style={{fontSize:12.5,color:T.inkSoft}}>Sort by</span>
      {[["project_points","Project points"],["leaderboard_points","Leaderboard"],["name","Name"],["total_reps","Repeats"]].map(([k,l])=>
        <button key={k} onClick={()=>setSortKey(k)} className="lg-press" style={sortChip(sortKey===k)}>{l}</button>)}
    </div>
    <div style={{display:"flex",flexDirection:"column",gap:8}}>
      {sorted.map(r=><div key={r.enrollment_id} style={rosterRow}>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontSize:15,fontWeight:700,display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
            <button className="lg-press" onClick={()=>setDetailFor(r)} style={{display:"inline-flex",alignItems:"center",gap:4,background:"none",border:"none",padding:0,cursor:"pointer",fontFamily:"inherit",fontSize:15,fontWeight:700,color:T.anchor}}>{r.name}<IChevR s={14} c={T.inkSoft}/></button>
            <span style={{fontSize:11.5,fontWeight:600,color:T.anchor,background:"#EFEDF7",padding:"2px 8px",borderRadius:6}}>{r.animal_nickname}</span>
            {r.flagged && <span style={{fontSize:11,fontWeight:700,color:"#B23B2E",background:"#FBE3DF",padding:"2px 8px",borderRadius:6}}>Grinding · {r.max_task_reps}× one task</span>}
            {!r.opted_in && <span style={{fontSize:11,color:T.inkSoft}}>off the board</span>}
          </div>
          <div style={{fontSize:12.5,color:T.inkSoft,marginTop:5,display:"flex",gap:14,flexWrap:"wrap"}}>
            <span><b style={{color:T.coral}}>{r.project_points}</b>/100 project</span>
            <span><b style={{color:T.medium}}>{r.leaderboard_points}</b> leaderboard</span>
            <span>{r.total_reps} repeats</span>
            {r.points_adjustment!==0 && <span>adj {r.points_adjustment>0?"+":""}{r.points_adjustment}</span>}
          </div>
        </div>
        <div style={{display:"flex",gap:7,flexShrink:0}}>
          <button className="lg-press" onClick={()=>setAdjFor(r)} style={miniBtn}>Adjust</button>
          <button className="lg-press" onClick={()=>nudge(r)} style={{...miniBtn,background:T.anchor,color:"#fff",border:"none"}}><IBell s={14} c="#fff"/> Nudge</button>
        </div>
      </div>)}
    </div>
    {adjFor && <AdjustPoints row={adjFor} onClose={()=>setAdjFor(null)} onSaved={()=>{setAdjFor(null);reload();}} showToast={showToast}/>}
    {detailFor && <StudentDetail row={detailFor} tasks={tasks} onClose={()=>setDetailFor(null)}/>}
  </div>;
}

function StudentDetail({row,tasks,onClose}){
  const [comps,setComps]=useState(null);
  useEffect(()=>{ (async()=>{
    const {data}=await sb.from("completions").select("task_id, completed_at").eq("enrollment_id",row.enrollment_id).order("completed_at");
    setComps(data||[]);
  })(); },[row.enrollment_id]);
  const byId=useMemo(()=>Object.fromEntries((tasks||[]).map(t=>[t.id,t])),[tasks]);
  const byTask={}; (comps||[]).forEach(c=>{ const e=byTask[c.task_id]||(byTask[c.task_id]={count:0,last:null}); e.count++; e.last=c.completed_at; });
  const byTier={Easy:[],Medium:[],Hard:[],Expert:[]};
  Object.entries(byTask).forEach(([tid,info])=>{ const t=byId[tid]; if(t&&byTier[t.tier]) byTier[t.tier].push({t,info}); });
  const totalDistinct=Object.keys(byTask).length;
  const totalCompletions=(comps||[]).length;
  return <Modal onClose={onClose} title={"What "+row.name+" has logged"}>
    {comps===null ? <div style={{display:"grid",placeItems:"center",padding:24}}><div className="lg-spin"/></div> : <div>
      <div style={{fontSize:12.5,color:T.inkSoft,marginBottom:14,lineHeight:1.5}}>{row.animal_nickname} · {totalDistinct} {totalDistinct===1?"task":"tasks"} logged · {totalCompletions} total {totalCompletions===1?"completion":"completions"} · {row.project_points}/100 project</div>
      <div className="lg-scroll" style={{maxHeight:"58vh",overflowY:"auto"}}>
        {tiers.map(tier=>{
          const items=(byTier[tier]||[]).slice().sort((a,b)=>(a.t.sort_order||0)-(b.t.sort_order||0));
          const m=tierMeta[tier];
          const coreDone=items.filter(x=>x.t.core_or_bonus==="Core").length;
          return <div key={tier} style={{marginBottom:14}}>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:6}}>
              <span style={{fontSize:12,fontWeight:700,color:m.c,letterSpacing:.4,textTransform:"uppercase"}}>{tier}</span>
              <span style={{fontSize:11.5,color:T.inkSoft}}>{Math.min(coreDone,m.req)}/{m.req} core done</span>
            </div>
            {items.length===0 ? <div style={{fontSize:12.5,color:T.inkSoft,padding:"1px 0 3px"}}>Nothing logged yet</div> :
              <div style={{display:"flex",flexDirection:"column",gap:6}}>
                {items.map(({t,info})=><div key={t.id} style={{display:"flex",alignItems:"center",gap:8,background:t.core_or_bonus==="Bonus"?"#FAF2D8":T.surface,border:`1px solid ${T.line}`,borderRadius:10,padding:"8px 11px"}}>
                  <div style={{flex:1,minWidth:0,fontSize:13.5,fontWeight:600,lineHeight:1.3}}>{t.title}</div>
                  <Tag c={t.core_or_bonus==="Bonus"?"#9A7B1E":T.anchor} bg={t.core_or_bonus==="Bonus"?"#F6EFD9":"#EFEDF7"}>{t.core_or_bonus}</Tag>
                  {info.count>1 && <span style={{fontSize:11.5,color:T.inkSoft,display:"flex",alignItems:"center",gap:3,flexShrink:0}}><IRepeat s={12}/>{info.count}×</span>}
                </div>)}
              </div>}
          </div>;
        })}
      </div>
    </div>}
  </Modal>;
}

function AdjustPoints({row,onClose,onSaved,showToast}){
  const [val,setVal]=useState(String(row.points_adjustment||0));
  const [busy,setBusy]=useState(false);
  const save=async()=>{
    setBusy(true);
    const n=parseInt(val,10);
    const {error}=await sb.from("enrollments").update({points_adjustment:isNaN(n)?0:n}).eq("id",row.enrollment_id);
    setBusy(false);
    if(error){ showToast("Could not save: "+error.message); return; }
    showToast("Points adjusted for "+row.animal_nickname); onSaved();
  };
  return <Modal onClose={onClose} title={"Adjust points · "+row.name}>
    <p style={{fontSize:13,color:T.inkSoft,marginBottom:12,lineHeight:1.5}}>This adds or subtracts leaderboard points for this student, for extra credit or a correction. Use a negative number to subtract. It does not change project (grade) points.</p>
    <Field label="Points adjustment" value={val} onChange={setVal} type="number" placeholder="0"/>
    <button className="lg-press" onClick={save} disabled={busy} style={{...btnPrimary,width:"100%",marginTop:12,justifyContent:"center"}}>{busy?"...":"Save"}</button>
  </Modal>;
}

function Schedule({sched,reload,showToast}){
  const [rows,setRows]=useState(sched.map(s=>({...s})));
  const [busy,setBusy]=useState(false);
  useEffect(()=>{ setRows(sched.map(s=>({...s}))); },[sched]);
  const setRow=(i,patch)=>setRows(rs=>rs.map((r,j)=>j===i?{...r,...patch}:r));
  const save=async()=>{
    setBusy(true);
    for(const r of rows){
      await sb.from("schedule").update({unlock_date:r.unlock_date||null,is_locked:r.is_locked}).eq("id",r.id);
    }
    setBusy(false); showToast("Schedule saved"); reload();
  };
  return <div>
    <p style={{fontSize:13,color:T.inkSoft,marginBottom:14,lineHeight:1.5,maxWidth:560}}>Set when each tier opens. Open tiers are available now; locked tiers let students peek at the tasks but not complete them. The date shows students when it unlocks.</p>
    <div style={{display:"flex",flexDirection:"column",gap:10,maxWidth:560}}>
      {rows.map((r,i)=>{const m=tierMeta[r.tier];return <div key={r.id} style={{display:"flex",alignItems:"center",gap:12,background:T.surface,border:`1px solid ${T.line}`,borderRadius:14,padding:"12px 14px",flexWrap:"wrap"}}>
        <span style={{fontWeight:700,color:m.c,minWidth:64}}>{r.tier}</span>
        <input type="date" value={r.unlock_date||""} onChange={e=>setRow(i,{unlock_date:e.target.value})} style={{padding:"8px 10px",borderRadius:10,border:`1px solid ${T.line}`,fontSize:14,fontFamily:"inherit",background:T.bg}}/>
        <button className="lg-press" onClick={()=>setRow(i,{is_locked:!r.is_locked})} style={{marginLeft:"auto",padding:"8px 14px",borderRadius:10,border:"none",cursor:"pointer",fontWeight:600,fontSize:13,fontFamily:"inherit",background:r.is_locked?"#F0EEF6":m.c,color:r.is_locked?T.inkSoft:"#fff",minWidth:78}}>{r.is_locked?"Locked":"Open"}</button>
      </div>;})}
    </div>
    <button className="lg-press" onClick={save} disabled={busy} style={{...btnPrimary,marginTop:16,justifyContent:"center"}}>{busy?"...":"Save schedule"}</button>
  </div>;
}

function Settings({sec,reload,showToast,onDelete,onArchive,archived}){
  const [thr,setThr]=useState(String(sec.repeat_flag_threshold));
  const [days,setDays]=useState(String(sec.nudge_after_days));
  const [lbEnabled,setLbEnabled]=useState(sec.leaderboard_enabled);
  const [busy,setBusy]=useState(false);
  const save=async()=>{
    setBusy(true);
    const {error}=await sb.from("sections").update({
      repeat_flag_threshold:parseInt(thr,10)||4,
      nudge_after_days:parseInt(days,10)||4,
      leaderboard_enabled:lbEnabled
    }).eq("id",sec.id);
    setBusy(false);
    if(error){ showToast("Could not save: "+error.message); return; }
    showToast("Settings saved"); reload();
  };
  return <div style={{maxWidth:480}}>
    <Field label="Flag a student after they repeat one task more than this many times" value={thr} onChange={setThr} type="number"/>
    <Field label="Suggest a nudge after a tier has been open this many days" value={days} onChange={setDays} type="number"/>
    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",background:T.surface,border:`1px solid ${T.line}`,borderRadius:12,padding:"12px 14px",margin:"4px 0 16px"}}>
      <div style={{fontSize:14,fontWeight:600}}>Leaderboard on for this section</div>
      <button className="lg-press" onClick={()=>setLbEnabled(v=>!v)} style={{padding:"7px 14px",borderRadius:10,border:"none",cursor:"pointer",fontWeight:600,fontSize:13,fontFamily:"inherit",background:lbEnabled?T.easy:"#F0EEF6",color:lbEnabled?"#fff":T.inkSoft,minWidth:60}}>{lbEnabled?"On":"Off"}</button>
    </div>
    <button className="lg-press" onClick={save} disabled={busy} style={{...btnPrimary,justifyContent:"center"}}>{busy?"...":"Save settings"}</button>
    {onArchive && <div style={{marginTop:24,paddingTop:18,borderTop:`1px solid ${T.line}`}}>
      <div style={{fontSize:12,fontWeight:700,color:T.ink,letterSpacing:.3,textTransform:"uppercase",marginBottom:6}}>End of semester</div>
      <p style={{fontSize:12.5,color:T.inkSoft,lineHeight:1.5,margin:"0 0 10px"}}>{archived ? "This section is archived and hidden from your main list. Everything in it is preserved. Unarchive to bring it back." : "Archiving hides this section from your main list but keeps every record, in case a grade question comes up later. You can unarchive anytime."}</p>
      <button className="lg-press" onClick={()=>onArchive(!archived)} style={{padding:"9px 14px",borderRadius:11,border:`1px solid ${T.line}`,background:"#fff",color:T.anchor,cursor:"pointer",fontWeight:700,fontSize:13.5,fontFamily:"inherit"}}>{archived?"Unarchive this section":"Archive this section"}</button>
    </div>}
    {onDelete && <div style={{marginTop:26,paddingTop:18,borderTop:`1px solid ${T.line}`}}>
      <div style={{fontSize:12,fontWeight:700,color:"#B23B2E",letterSpacing:.3,textTransform:"uppercase",marginBottom:6}}>Danger zone</div>
      <p style={{fontSize:12.5,color:T.inkSoft,lineHeight:1.5,margin:"0 0 10px"}}>Deleting a section permanently removes it along with every student's enrollment and progress in it. Best used for test sections.</p>
      <button className="lg-press" onClick={onDelete} style={{padding:"9px 14px",borderRadius:11,border:"1px solid #E7B1A8",background:"#FBE7E1",color:"#B23B2E",cursor:"pointer",fontWeight:700,fontSize:13.5,fontFamily:"inherit"}}>Delete this section</button>
    </div>}
  </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
